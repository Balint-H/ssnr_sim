<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">

<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5A7480"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#1B2B33" flood-opacity="0.12"/>
  </filter>
</defs>
<rect width="940" height="340" fill="#FFFFFF"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#1B2B33">PD control loop</text>
<circle cx="168" cy="150" r="20" fill="#FFFFFF" stroke="#1B2B33" stroke-width="1.6"/>
<text x="168" y="156" text-anchor="middle" font-size="20" fill="#1B2B33">Σ</text>
<text x="142" y="134" font-size="15" font-weight="700" fill="#2A6F97">+</text>
<text x="178" y="184" font-size="17" font-weight="700" fill="#B14A3B">−</text>
<text x="34" y="155" font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#1B2B33"><tspan font-size="16.0">q</tspan><tspan dy="3.8" font-size="10.6">target</tspan></text>
<line x1="118" y1="150" x2="145" y2="150" stroke="#5A7480" stroke-width="2" marker-end="url(#ah)"/>
<line x1="188" y1="150" x2="262" y2="150" stroke="#5A7480" stroke-width="2" marker-end="url(#ah)"/>
<text x="225" y="141" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#1B2B33">e</text>
<rect x="262" y="104" width="246" height="92" rx="12" fill="#FFFFFF" stroke="#D6E0E4" stroke-width="1.4" filter="url(#sh)"/>
<rect x="262" y="104" width="6.5" height="92" rx="3" fill="#0F7B82"/>
<text x="284" y="138" font-size="16.5" font-weight="700" fill="#1B2B33">PD controller</text>
<text x="284" y="166" font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#1B2B33"><tspan font-size="17.0">τ = K</tspan><tspan dy="4.1" font-size="11.2">p</tspan><tspan dy="-4.1" font-size="17.0"> e + K</tspan><tspan dy="4.1" font-size="11.2">d</tspan><tspan dy="-4.1" font-size="17.0"> ė</tspan></text>
<text x="284" y="186" font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#5A7480"><tspan font-size="11.5">K</tspan><tspan dy="2.8" font-size="7.6">p</tspan><tspan dy="-2.8" font-size="11.5"> → stiffness    K</tspan><tspan dy="2.8" font-size="7.6">d</tspan><tspan dy="-2.8" font-size="11.5"> → damping</tspan></text>
<line x1="508" y1="150" x2="602" y2="150" stroke="#5A7480" stroke-width="2" marker-end="url(#ah)"/>
<text x="555" y="124" text-anchor="middle" font-size="9.5" fill="#5A7480">joint torque</text>
<text x="555" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#1B2B33">τ</text>
<rect x="602" y="104" width="210" height="92" rx="12" fill="#FFFFFF" stroke="#D6E0E4" stroke-width="1.4" filter="url(#sh)"/>
<rect x="602" y="104" width="6.5" height="92" rx="3" fill="#3D5663"/>
<text x="624" y="138" font-size="16.5" font-weight="700" fill="#1B2B33">Arm dynamics</text>
<text x="624" y="162" font-family="ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12.5" fill="#5A7480">MuJoCo forward sim</text>
<line x1="812" y1="150" x2="914" y2="150" stroke="#5A7480" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="868" cy="150" r="3.6" fill="#5A7480"/>
<text x="840" y="124" text-anchor="middle" font-size="9.5" fill="#5A7480">joint angle</text>
<text x="840" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#1B2B33">q</text>
<path d="M868,150 V286 H168 V172" fill="none" stroke="#5A7480" stroke-width="2" marker-end="url(#ah)"/>
<text x="518" y="277" text-anchor="middle" font-size="12" fill="#5A7480">measured state<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" dx="8">  (q, q̇)</tspan></text>
</svg>