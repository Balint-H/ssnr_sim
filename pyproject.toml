readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dm-control>=1.0.38",
    "jax>=0.6.2",
    "jupyterlab>=4.5.7",
    "loop-rate-limiters>=1.2.0",
    "matplotlib>=3.10.9",
    "mujoco==3.6",
    "mujoco-mjx==3.6",
    "pip>=26.1.1",
